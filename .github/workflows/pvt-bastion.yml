---
name: Deploy bastion to p2-sandbox

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Select action to perform'
        type: choice
        required: true
        options:
          - 'deploy'
          - 'destroy'
        default: 'deploy'

jobs:
  deploy:
    permissions: write-all
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/bastion/dev
    env:
      REGION: ap-southeast-2
      ENV: dev
      STACK_NAME: p2-sandbox
      ROOTSTACK: projecthub
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      ENDPOINT: projecthub.p2-sandbox.practera.com
      ACM_NAME: cdn.p2-sandbox.practera.com
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.4'
      - name: Get AWS Organization Number
        id: AWS_ORG
        run: |
          P2SANDBOX=$(echo $AWS_ACCOUNT_ID | jq -r .P2SANDBOX)
          echo "::add-mask::$P2SANDBOX"
          echo "P2SANDBOX=$P2SANDBOX" >> $GITHUB_OUTPUT
      - name: Configure AWS Credentials from P2SANDBOX Account
        uses: ./.github/actions/aws-oidc
        with:
          role-to-assume: arn:aws:iam::${{ steps.AWS_ORG.outputs.P2SANDBOX }}:role/github-restricted-role-to-assume
          region: ${{ env.REGION }}
      - name: terraform init
        run: |
          terraform init
      - name: .env create
        if: ${{ github.event.inputs.action == 'deploy' }}
        run: |
          cat >> .env <<EOF
          OPENAI_API_KEY=$OPENAI_API_KEY
          EMAIL_USER=$EMAIL_USER
          EMAIL_PASS=$EMAIL_PASS
          EMAIL_HOST=sandbox.smtp.mailtrap.io
          EMAIL_PORT=2525
          EMAIL_PROVIDER=mailtrap

          GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
          GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET
          ADMIN_USERS="rodney@practera.com,wes@practera.com,megan.sitoy@practera.com,shawn@practera.com,chaw@practera.com,terence@practera.com"
          AUTO_REGISTER_DOMAIN="practera.com"

          DATABASE_URL=$DATABASE_URL
          NEXT_PUBLIC_AUTH_URL=https://$ENDPOINT

          EOF
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: terraform apply
        if: ${{ github.event.inputs.action == 'deploy' }}
        run: |
          terraform apply -var-file=default.tfvars -auto-approve
      - name: terraform destroy
        if: ${{ github.event.inputs.action == 'destroy' }}
        run: |
          terraform destroy -var-file=default.tfvars -auto-approve

